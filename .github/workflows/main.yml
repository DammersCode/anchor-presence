name: Main checks

# Every push to main: the fast checks again (release.yml waits only for this run), then the slow suites.
on:
  push:
    branches: [main]
    paths-ignore: ["plans/**"]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # One job: GitHub bills each job rounded up to a full minute.
  suites:
    name: Checks, SignalR hub, bench, e2e, and docs build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build packages
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      # .NET is installed above, so this run includes the real SignalR hub test.
      - name: Unit tests
        run: bun run test
      - name: Check package exports and unused code
        run: bun run check:package && bun run check:unused
      # A noisy runner can miss the budget once; fail only when 3 runs in a row miss it.
      - name: Bench (3x baseline guard)
        run: |
          for attempt in 1 2 3; do
            bun run bench && exit 0
            echo "bench attempt $attempt failed"
          done
          exit 1
      - name: Demo production build
        run: bunx vite build
        working-directory: apps/demo
      # Preinstalled Chrome (channel "chrome"); Firefox and WebKit run locally before a release.
      - name: E2E (chromium)
        run: bunx playwright test --project=chromium --reporter=list
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - uses: actions/cache@v6
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-docs-next-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/content/**', 'apps/docs/app/**') }}
          restore-keys: ${{ runner.os }}-docs-next-${{ hashFiles('bun.lock') }}-
      - name: Docs build (typecheck + next build)
        run: bun run --cwd apps/docs build
