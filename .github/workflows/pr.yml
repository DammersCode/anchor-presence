name: PR checks

# Fast checks only, as parallel jobs. The slow suites (e2e, docs build, .NET hub, bench) run once on main, never twice.
on:
  pull_request:
    paths-ignore: ["plans/**"]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only listed maintainers burn Actions minutes: add a login to the fromJSON list of each job to let another user's PRs run checks.
jobs:
  types:
    name: Typecheck and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bun run typecheck
      - name: Check every vitest project runs in the test matrix
        run: node scripts/check-ci-projects.mjs
      - name: Check package exports and unused code
        run: bun run check:package && bun run check:unused

  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint

  test:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: packages
            projects: --project core --project dom --project react --project demo --project audit-skill --project built-packages
          - name: relays
            projects: --project server --project relay-conformance --project hono-example --project node-ws-example
          - name: examples
            projects: --project elysia-example --project bun-native-example --project socketio-example --project signalr-example
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The real SignalR hub test needs .NET; the hub job on main runs it.
      - name: Unit tests
        run: bunx vitest run ${{ matrix.projects }} --exclude examples/signalr/signalr-hub.test.ts

  informational:
    name: Bun runtime smoke and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Informational until it is proven stable on Linux; the timeout ends a hang the script's own watchdog misses.
      - name: Relays under the Bun runtime
        continue-on-error: true
        timeout-minutes: 3
        run: timeout -k 5 90 bun scripts/runtime-smoke.ts
      - name: Dependency audit
        run: bun audit --audit-level=high
