name: Main checks

# Every push to main, as parallel jobs. release.yml waits for this whole run, so the fast checks are here too.
on:
  push:
    branches: [main]
    paths-ignore: ["plans/**"]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bun run typecheck
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Check package exports and unused code
        run: bun run check:package && bun run check:unused

  test:
    name: Unit tests (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: bunx vitest run --shard=${{ matrix.shard }}/3 --exclude examples/signalr/signalr-hub.test.ts

  hub:
    name: SignalR hub (real .NET server)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"
      - name: SignalR hub integration
        run: bunx vitest run examples/signalr/signalr-hub.test.ts

  bench:
    name: Bench (3x baseline guard)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # A noisy runner can miss the budget once; fail only when 3 runs in a row miss it.
      - name: Bench
        run: |
          for attempt in 1 2 3; do
            bun run bench && exit 0
            echo "bench attempt $attempt failed"
          done
          exit 1

  e2e:
    name: Demo build and e2e (chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Demo production build
        run: bunx vite build
        working-directory: apps/demo
      # Preinstalled Chrome (channel "chrome").
      - name: E2E (chromium)
        run: bunx playwright test --project=chromium --reporter=list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  e2e-cross-browser:
    name: Demo e2e (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Demo production build
        run: bunx vite build
        working-directory: apps/demo
      - name: Install browser
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: E2E (${{ matrix.browser }})
        run: bunx playwright test --project=${{ matrix.browser }} --reporter=list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: test-results/

  react-variants:
    name: React tests (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [react-18, react-compiler]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Install React 18
        if: matrix.variant == 'react-18'
        run: |
          mkdir .react18
          npm install --prefix .react18 react@18.3.1 react-dom@18.3.1
      - name: Test
        run: bun run test:${{ matrix.variant }}

  docs:
    name: Docs build (typecheck and next build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-docs-next-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/content/**', 'apps/docs/app/**') }}
          restore-keys: ${{ runner.os }}-docs-next-${{ hashFiles('bun.lock') }}-
      - name: Docs build
        run: bun run --cwd apps/docs build
