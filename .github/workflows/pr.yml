name: PR checks

# Fast checks only. The slow suites (e2e, docs build, .NET hub, bench) run once on main, never twice.
on:
  pull_request:
    paths-ignore: ["plans/**"]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Outside PRs skip at 0 minutes; to check one, run this workflow on its branch from the Actions tab.
    if: >-
      github.event_name != 'pull_request' ||
      contains('["DammersCode"]', github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run lint
      # No .NET on this runner, so the real SignalR hub test skips itself; main runs it.
      - run: bun run test
