name: Main checks

# The slow suites, once per push to main. PR checks already covered build, typecheck, format, lint, and unit tests.
on:
  push:
    branches: [main]
    paths-ignore: ["plans/**"]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job: GitHub bills each job rounded up to a full minute.
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: bun run build
      - name: SignalR hub integration (real .NET server)
        run: bunx vitest run examples/signalr/signalr-hub.test.ts
      - name: Bench (3x baseline guard)
        run: bun run bench
      - name: Demo production build
        run: bunx vite build
        working-directory: apps/demo
      # Preinstalled Chrome (channel "chrome"); Firefox and WebKit run locally before a release.
      - name: E2E (chromium)
        run: bunx playwright test --project=chromium --reporter=list
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - uses: actions/cache@v6
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-docs-next-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/content/**', 'apps/docs/app/**') }}
          restore-keys: ${{ runner.os }}-docs-next-${{ hashFiles('bun.lock') }}-
      - name: Docs build (typecheck + next build)
        run: bun run --cwd apps/docs build
