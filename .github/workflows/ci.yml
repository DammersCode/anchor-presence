name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      # bench: vitest 5 --project filter bug, run locally with `bunx vitest bench --run --project core`
      - name: Demo production build
        run: bunx vite build
        working-directory: apps/demo
      # No browser install: the chromium project uses the runner's preinstalled Chrome (channel "chrome").
      # Firefox/WebKit take ~30 min to install here - run the full suite locally before merging.
      - name: E2E (chromium, preinstalled Chrome)
        run: bunx playwright test --project=chromium --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
