<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anchor-presence — SignalR</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f9fafb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        padding: 1rem 1.5rem;
        background: #111827;
        color: #f9fafb;
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }
      .status {
        font-size: 0.8rem;
        opacity: 0.85;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        padding: 1.5rem;
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .card h2 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .card p {
        margin: 0;
        font-size: 0.85rem;
        line-height: 1.5;
        color: #4b5563;
      }
      .meter {
        height: 10px;
        border-radius: 999px;
        background: #e5e7eb;
        overflow: hidden;
      }
      .meter > span {
        display: block;
        height: 100%;
        border-radius: inherit;
      }
      .meter-fill {
        background: #10b981;
        width: 62%;
      }
      .meter-fill-alt {
        background: #6366f1;
        width: 38%;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .tag {
        font-size: 0.8rem;
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        background: #eef2ff;
        border: 1px solid #e0e7ff;
      }
      .cursor {
        pointer-events: none;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 50;
      }
      .cursor .cursor svg {
        display: block;
      }
      .cursor .cursor .label {
        margin-left: 0.35rem;
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 500;
        color: #ffffff;
        padding: 0.1rem 0.45rem;
        border-radius: 0.4rem;
      }
      .foot {
        padding: 0.75rem 1.5rem;
        font-size: 0.75rem;
        color: #6b7280;
        border-top: 1px solid #e5e7eb;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
