name: PR checks

# Fast checks only. The slow suites (e2e, docs build, .NET hub, bench) run once on main, never twice.
on:
  pull_request:
    paths-ignore: ["plans/**"]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build, typecheck, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only listed maintainers burn Actions minutes; add a login to let another user's PRs run checks.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Check package exports and unused code
        run: bun run check:package && bun run check:unused
      # No .NET on this runner, so the real SignalR hub test skips itself; main runs it.
      - name: Unit tests
        run: bun run test
      # Informational until it is proven stable on Linux; the timeout ends a hang the script's own watchdog misses.
      - name: Relays under the Bun runtime (informational)
        continue-on-error: true
        timeout-minutes: 3
        run: timeout -k 5 90 bun scripts/runtime-smoke.ts
      - name: Dependency audit
        continue-on-error: true
        run: bun run audit
