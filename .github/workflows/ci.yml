name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      # Non-blocking until the baseline is re-recorded on CI hardware (`bun run bench -- --update-baseline`).
      - name: Bench (3x baseline guard)
        run: bun run bench
        continue-on-error: true
      - name: Demo production build
        run: bunx vite build
        working-directory: apps/demo
      # No browser install: the chromium project uses the runner's preinstalled Chrome (channel "chrome").
      # Firefox/WebKit take ~30 min to install here - run the full suite locally before merging.
      - name: E2E (chromium, preinstalled Chrome)
        run: bunx playwright test --project=chromium --reporter=list
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Cache docs build cache
        uses: actions/cache@v6
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-docs-next-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/content/**', 'apps/docs/app/**') }}
          restore-keys: |
            ${{ runner.os }}-docs-next-${{ hashFiles('bun.lock') }}-
      - name: Build docs site (typecheck + next build)
        run: bun run docs:build
