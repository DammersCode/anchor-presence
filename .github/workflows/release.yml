name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  actions: read
jobs:
  publish:
    name: Publish to npm and create the GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Checks run once on main; the release waits for that run instead of repeating it.
      # npm version pushes the commit and the tag together, so the run can still be in progress here.
      - name: Wait for green main checks on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 10
          done
          test -n "$id" || { echo "::error::No Main checks run for $GITHUB_SHA. Tag a commit that was pushed to main."; exit 1; }
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships older
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Check the tag matches the package versions
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      # npm view makes each publish idempotent: a re-run publishes only what is missing
      - name: Publish @anchor-presence/core
        run: npm view @anchor-presence/core@${GITHUB_REF_NAME#v} version 2>/dev/null || (cd packages/core && npm publish --provenance --access public)
      - name: Publish @anchor-presence/dom
        run: npm view @anchor-presence/dom@${GITHUB_REF_NAME#v} version 2>/dev/null || (cd packages/dom && npm publish --provenance --access public)
      - name: Publish @anchor-presence/react
        run: npm view @anchor-presence/react@${GITHUB_REF_NAME#v} version 2>/dev/null || (cd packages/react && npm publish --provenance --access public)
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
